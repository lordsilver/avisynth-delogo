name: Toolchain

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: toolchain-${{ github.workflow }}-${{ github.ref }}
  # A tag run is never cancelled halfway through publishing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pinned tools
        uses: jdx/mise-action@v5
        with:
          cache: true

      # Fails when actions.lock drifts from the workflows or a locked commit no
      # longer verifies upstream.
      - name: Verify workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh-actions-lock --verify

      - name: Validate repository and run regression tests
        run: mise run check

  build:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pinned tools
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Collect and verify pinned sources
        shell: pwsh
        run: mise run collect:sources -- -CacheDirectory "$env:RUNNER_TEMP\source-cache" -OutputDirectory "$env:RUNNER_TEMP\source-assets"

      - name: Select artifact version
        shell: pwsh
        run: |
          $releaseVersion = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME -replace '^v', '' } else { "ci-$env:GITHUB_RUN_NUMBER" }
          "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV

      - name: Build verified x64 bundle
        shell: pwsh
        run: mise run build:toolchain -- -OutputDirectory "$env:RUNNER_TEMP\dist" -OfflineCacheRoot "$env:RUNNER_TEMP\source-cache" -Version $env:RELEASE_VERSION

      - name: Build verified source archive
        shell: pwsh
        run: mise run build:sources -- -SourceDirectory "$env:RUNNER_TEMP\source-assets" -OutputDirectory "$env:RUNNER_TEMP\source-dist" -Version $env:RELEASE_VERSION

      - name: Test exact release archives and bundled runtime
        shell: pwsh
        run: mise run test:release -- -ToolchainArchive "$env:RUNNER_TEMP\dist\avisynth-delogo-x64-$env:RELEASE_VERSION.zip" -SourceArchive "$env:RUNNER_TEMP\source-dist\avisynth-delogo-sources-$env:RELEASE_VERSION.zip"

      - name: Upload exact release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: avisynth-delogo-bundles
          path: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.sha256
            ${{ runner.temp }}/source-dist/*.zip
            ${{ runner.temp }}/source-dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  # Only this job can write to the repository, and only for a version tag.
  # Each release is created with its files in one call, so a release page
  # never shows up without its ZIPs.
  publish:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download exact release artifacts
        uses: actions/download-artifact@v8
        with:
          name: avisynth-delogo-bundles
          path: ${{ runner.temp }}

      - name: Publish tagged source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $sourceTag = "sources-v$releaseVersion"
          $sourceTitle = "AviSynth Delogo Sources $releaseVersion"
          $notes = "Exact upstream archives, packages, and manifests used to build AviSynth Delogo v$releaseVersion. Every input was verified against toolchain/manifests/toolchain.lock.json before publication. FrameSel and RT_Stats are recovered from the author archive URLs linked by the AviSynth Wiki through the Internet Archive."
          $files = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/source-dist" -File | ForEach-Object FullName)
          gh release view $sourceTag 2>$null
          if ($LASTEXITCODE -ne 0) {
              gh release create $sourceTag @files --target $env:GITHUB_SHA --title $sourceTitle --notes $notes --latest=false
          }
          else {
              gh api "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$sourceTag" --method PATCH -f "sha=$env:GITHUB_SHA" -F force=true | Out-Null
              gh release upload $sourceTag @files --clobber
              gh release edit $sourceTag --target $env:GITHUB_SHA --title $sourceTitle --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing $sourceTag failed." }

      - name: Publish tagged toolchain release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $releaseTitle = "AviSynth Delogo $releaseVersion"
          $releaseNotes = "Ready-to-use portable Windows x64 bundle built from the matching sources-v$releaseVersion release."
          $files = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/dist" -File | ForEach-Object FullName)
          gh release view "$env:GITHUB_REF_NAME" 2>$null
          if ($LASTEXITCODE -ne 0) {
              gh release create "$env:GITHUB_REF_NAME" @files --title $releaseTitle --notes $releaseNotes --verify-tag
          }
          else {
              gh release upload "$env:GITHUB_REF_NAME" @files --clobber
              gh release edit "$env:GITHUB_REF_NAME" --title $releaseTitle --notes $releaseNotes
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing $env:GITHUB_REF_NAME failed." }
